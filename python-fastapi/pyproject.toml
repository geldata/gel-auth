[project]
name = "gel-auth-fastapi"
description = "Gel auth extension binding for FastAPI"
readme = "README.md"
authors = [
    { name = "Gel Data Inc.", email = "hello@geldata.com" }
]
requires-python = ">=3.9"
dependencies = []
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.7",
]

[tool.mypy]
exclude = [
    "^.eggs",
    "^.github",
    "^.vscode",
    "^build",
    "^dist",
    "^docs",
    "^target",
]
files = "."
python_version = "3.9"

[tool.ruff]
line-length = 80
indent-width = 4

[tool.black]
line-length = 80
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.hatch.version]
path = "src/gel_auth_fastapi/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/examples",
]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
